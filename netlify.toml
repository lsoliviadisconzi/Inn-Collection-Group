[build]
  publish = "pages"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/menu-explorer.html"
  status = 302

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/documents/*"
  to = "/documents/:splat"
  status = 200
