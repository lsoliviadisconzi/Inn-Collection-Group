<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  .brand{margin-left:auto;display:flex;align-items:center;gap:10px;opacity:.85}
    .brand+.hint{margin-left:0}
    .brand img{height:clamp(28px,4.6vh,42px);width:auto;display:block}
    .brand b{font-family:var(--display);font-weight:600;font-size:clamp(13px,1.1vw,16px);letter-spacing:.2em;text-transform:uppercase;color:#dcd9d3;white-space:nowrap}
.sch{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(7,1fr);gap:8px 4px;align-items:center;font-size:13px}
.sch b{text-align:center;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sch .sn{font-weight:500}.sch .sd{display:flex;justify-content:center;gap:4px;min-height:18px}
.dv,.ob{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dv,.legend .dv{width:10px;height:10px;background:var(--gold)}.ob,.legend .ob{width:10px;height:10px;border:1.5px solid var(--gold-2);background:transparent}
.fld{font:inherit;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--gold-dim);border-radius:8px;padding:4px 8px;width:96px;text-align:right}
select.fld{width:auto;text-align:left}.fld:disabled{opacity:.45}
.fldw{display:flex;align-items:center;gap:6px}
.trc{display:flex;align-items:center;gap:16px}.trc input[type=range]{flex:1;accent-color:var(--gold)}
.pb{cursor:pointer;background:var(--gold-faint)}.pb:hover,.chip.sel{background:var(--gold);color:#1a1409}
.chip.ok{background:var(--ok);color:#0b0a09;border-color:var(--ok)}.chip.no{background:var(--bad);color:#0b0a09;border-color:var(--bad)}
.ns{animation:none!important}
.vr{margin-top:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--gold-dim);font-size:13.5px;font-weight:600}
.vr.neg{color:var(--bad);border-color:var(--bad)}.vr.pos{color:var(--gold-2)}
[data-al]{cursor:pointer}
.ap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pim{width:100%;height:96px;object-fit:cover;border-radius:10px}
.aid{border-color:var(--bad)}
.ap>*{min-width:0;overflow:hidden}
.ap .pim{display:block;max-width:100%}
.ap .rw{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:baseline}
.ap .rw .v{white-space:normal;text-align:left;overflow-wrap:anywhere}
.prof{display:flex;flex-wrap:wrap;gap:10px}.fl{display:grid;gap:4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mount{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}.plate{width:100%}
.label{padding:12px 14px;border:1px dashed var(--gold-dim);border-radius:12px;display:grid;gap:3px;margin-bottom:10px;font-size:13.5px}
.q{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:720px){.mount{grid-template-columns:1fr}.sch{font-size:11.5px}}
.hubhit{position:absolute;inset:-4px;z-index:3;background:none;border:0;border-radius:26px;cursor:pointer}
.hubimg{transition:filter .7s}.hubimg img{transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .7s}
.hubhit:hover~.hubimg img,.hubhit.hot~.hubimg img{transform:scale(1.025);filter:brightness(1.05) saturate(1.06)}
.hubhit:hover~.hubimg,.hubhit.hot~.hubimg{filter:drop-shadow(0 6px 24px rgba(212,175,106,.2))}
.hubcap strong{transition:color .6s}.hubhit:hover~.hubcap strong,.hubhit.hot~.hubcap strong{color:var(--gold-2)}
/* ---------- mobile experience ---------- */
@media (max-width:720px){
 .bt-row{gap:4px 12px;padding-inline:0}
 .bt-row .brand{order:-1;width:100%;margin:0 0 2px;justify-content:flex-start}
 .brand img{height:30px}.brand b{font-size:13px}
 .hint{margin-left:auto;font-size:11px;width:auto}
 .journey{flex-direction:row;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:2px 16px 10px;scrollbar-width:none}
 .journey::-webkit-scrollbar{display:none}
 .step,.step:first-child{flex:0 0 78%;height:156px;scroll-snap-align:start}
 .go{opacity:1;transform:none}
 .mach{grid-template-columns:1fr 1fr;gap:10px;align-items:stretch;padding-inline:16px}
 .col{display:contents}
 .hub{grid-column:1/-1;order:-1;margin-bottom:4px}
 .hubimg{width:min(100%,420px)}
 .hubcap::after{content:"Tap for the story and pairing";display:block;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
 .node,.col.l .node,.col.r .node{flex-direction:column;align-items:flex-start;gap:8px;width:100%;margin:0;padding:12px;border-radius:18px;min-height:96px}
 .nchev{display:none}.nt strong{font-size:15px}.nt small{font-size:11.5px}
 .node:hover{transform:none!important}
 .loop{--cs:42px;padding-inline:8px}
 .lsteps{flex-wrap:nowrap;justify-content:space-between;gap:0;width:100%}
 .lsteps li:not(.arr){flex:1 1 0}
 .lp{width:100%;gap:6px}.lp .ll{font-size:10.5px}.lp .ll b{font-size:12px}
 .ring{width:116px;order:2}.ring p{font-size:17px}
 .sh{gap:10px}.mnav button,.x{width:44px;height:44px}
 .hero{gap:10px;padding:12px 14px}.himg{aspect-ratio:16/6}.hcap strong{font-size:19px}
 .kpis{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none}
 .kpi{flex:0 0 auto;min-width:130px;padding:9px 12px}.kpi b{font-size:20px}
 .main{gap:18px}.sec h3{font-size:22px}
 .tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs button{white-space:nowrap;padding:9px 16px}
 input,select,.fld{font-size:16px}
 .chip.pb{padding:8px 13px}
 .sch{grid-template-columns:minmax(0,1.3fr) repeat(7,minmax(0,1fr));font-size:11.5px}.sch b{font-size:10px;letter-spacing:0}.sch .sn{line-height:1.2}
 .fl{flex:1 1 120px}.prof .fld{width:100%}
 .trc{gap:10px}
}
  </style>
</head>

<body>
  <title>Chicken Liver Parfait · The Lindisfarne Inn</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
  <style>
    /* Layout: three full-width bands (journey strip, hub-and-spoke machinery, loop) over a dark bokeh room.
   Sections are buttons: hover = preview card, click = sheet that grows out of the button. */
    :root {
      --bg: #0b0a09;
      --panel: #14110e;
      --panel-2: #1c1813;
      --text: #f3efe8;
      --muted: #b8b0a4;
      --gold: #d4af6a;
      --gold-2: #ecd49a;
      --gold-dim: rgba(212, 175, 106, .35);
      --gold-faint: rgba(212, 175, 106, .12);
      --line: rgba(255, 255, 255, .08);
      --ok: #6bbf7a;
      --warn: #d4a84b;
      --bad: #e05a5a;
      --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
      --ui: "Barlow Semi Condensed", "Helvetica Neue", system-ui, sans-serif;
      --s: clamp(16px, 2.2vw, 38px);
      --cs: clamp(52px, min(6.2vw, 9vh), 90px);
      color-scheme: dark;
    }

    [hidden] {
      display: none !important
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
      font-size: 15px;
      line-height: 1.4;
      overflow-x: clip;
      font-variant-numeric: tabular-nums
    }

    html.lock,
    html.lock body {
      overflow: hidden
    }

    button {
      font: inherit;
      color: inherit
    }

    h1,
    h2,
    h3,
    p,
    ol,
    ul,
    figure {
      margin: 0;
      padding: 0
    }

    ol,
    ul {
      list-style: none
    }

    svg {
      display: block
    }

    .ico svg,
    .ic svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    button:focus-visible {
      outline: 2px solid var(--gold-2);
      outline-offset: 2px
    }

    /* ---------- stage ---------- */
    .stage {
      position: relative;
      min-height: 100%;
      display: grid;
      grid-template-rows: auto auto auto;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(60vmax 40vmax at 8% -5%, rgba(212, 175, 106, .10), transparent 60%),
        radial-gradient(50vmax 40vmax at 100% 45%, rgba(200, 120, 50, .10), transparent 60%),
        linear-gradient(180deg, #14100c 0%, #0b0a09 55%, #0e0b08 100%)
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .55;
      filter: blur(2px);
      background:
        radial-gradient(circle at 78% 40%, rgba(255, 190, 100, .55) 0 5px, transparent 8px),
        radial-gradient(circle at 86% 47%, rgba(255, 170, 80, .45) 0 8px, transparent 11px),
        radial-gradient(circle at 93% 41%, rgba(255, 200, 120, .5) 0 4px, transparent 7px),
        radial-gradient(circle at 5% 49%, rgba(255, 180, 90, .4) 0 6px, transparent 9px),
        radial-gradient(circle at 11% 56%, rgba(255, 200, 120, .35) 0 4px, transparent 7px),
        radial-gradient(circle at 96% 54%, rgba(255, 160, 70, .35) 0 9px, transparent 12px),
        radial-gradient(circle at 60% 52%, rgba(255, 190, 100, .18) 0 5px, transparent 8px),
        radial-gradient(circle at 30% 54%, rgba(255, 190, 100, .2) 0 6px, transparent 9px)
    }

    .band {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-top: 1px solid var(--gold-faint)
    }

    .band:first-child {
      border-top: 0
    }

    .wrap {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    .bt-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 18px;
      padding-block: clamp(8px, 1.5vh, 18px) clamp(6px, 1.1vh, 12px)
    }

    .bt {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(24px, min(3vw, 4.6vh), 46px);
      line-height: 1;
      letter-spacing: .005em;
      text-wrap: balance
    }

    .sep {
      width: 1px;
      height: 1.5em;
      background: var(--gold-dim)
    }

    .tag {
      font-family: var(--display);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(16px, min(1.7vw, 2.7vh), 25px);
      color: var(--muted)
    }

    .hint {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .hint::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px var(--gold-faint)
    }

    .hint .t {
      display: none
    }

    @media (hover:none) {
      .hint .m {
        display: none
      }

      .hint .t {
        display: inline
      }
    }

    /* ---------- band 1: journey ---------- */
    .journey {
      display: flex;
      flex: 1;
      min-height: clamp(130px, 22vh, 300px);
      position: relative
    }

    .step {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      margin-left: calc(var(--s)*-1 + 6px);
      z-index: calc(10 - var(--i));
      pointer-events: none
    }

    .step:first-child {
      margin-left: 0
    }

    .ph {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      cursor: pointer;
      overflow: hidden;
      background: #000;
      pointer-events: auto;
      text-align: left;
      clip-path: polygon(var(--s) 0, 100% 0, calc(100% - var(--s)) 100%, 0 100%)
    }

    .step:first-child .ph {
      clip-path: polygon(0 0, 100% 0, calc(100% - var(--s)) 100%, 0 100%)
    }

    .step:last-child .ph {
      clip-path: polygon(var(--s) 0, 100% 0, 100% 100%, 0 100%)
    }

    .ph img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .8s cubic-bezier(.2, .8, .2, 1), filter .4s;
      filter: saturate(1.05)
    }

    .ph:hover img,
    .ph:focus-visible img {
      transform: scale(1.07);
      filter: saturate(1.15) brightness(1.06)
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 6, 4, .8) 0, rgba(8, 6, 4, .12) 40%, rgba(8, 6, 4, 0) 60%, rgba(8, 6, 4, .6) 100%)
    }

    .lab {
      position: absolute;
      top: clamp(10px, 1.8vh, 18px);
      left: calc(var(--s) + 12px);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      font-size: clamp(14px, 1.25vw, 18px);
      text-shadow: 0 1px 8px rgba(0, 0, 0, .6)
    }

    .step:first-child .lab {
      left: max(16px, env(safe-area-inset-left, 0px))
    }

    .lab b {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .75);
      display: grid;
      place-items: center;
      font-weight: 500;
      font-size: 14px;
      background: rgba(0, 0, 0, .25);
      flex-shrink: 0
    }

    .go {
      position: absolute;
      bottom: 12px;
      left: calc(var(--s) + 12px);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--gold-2);
      opacity: 0;
      transform: translateY(6px);
      transition: .3s
    }

    .step:first-child .go {
      left: max(16px, env(safe-area-inset-left, 0px))
    }

    .go svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ph:hover .go,
    .ph:focus-visible .go {
      opacity: 1;
      transform: none
    }

    .chev {
      position: absolute;
      top: 50%;
      right: calc(var(--s)/2 - 3px - 17px);
      width: 34px;
      height: 34px;
      margin-top: -17px;
      border-radius: 50%;
      background: rgba(12, 10, 8, .55);
      border: 1px solid rgba(255, 255, 255, .35);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 2
    }

    .chev svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .step:last-child .chev {
      display: none
    }

    /* ---------- band 2: machinery ---------- */
    .mach {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 34%) minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(8px, 2vw, 30px);
      padding-block: clamp(4px, .8vh, 10px) clamp(10px, 1.6vh, 22px)
    }

    .col {
      display: grid;
      gap: clamp(6px, 1.2vh, 14px);
      position: relative;
      z-index: 2
    }

    .node {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(100%, 340px);
      padding: clamp(5px, .9vh, 10px) 16px clamp(5px, .9vh, 10px) 10px;
      border-radius: 999px;
      background: rgba(24, 21, 17, .84);
      border: 1px solid var(--gold-dim);
      cursor: pointer;
      text-align: left;
      backdrop-filter: blur(10px);
      transition: border-color .25s, background .25s, transform .25s, box-shadow .25s
    }

    .col.l .node {
      justify-self: end;
      margin-right: calc(var(--o)*1.3vw)
    }

    .col.r .node {
      justify-self: start;
      margin-left: calc(var(--o)*1.3vw)
    }

    .node:hover,
    .node:focus-visible,
    .node.hot {
      border-color: var(--gold);
      background: rgba(34, 29, 22, .95);
      box-shadow: 0 0 0 4px var(--gold-faint), 0 10px 30px rgba(0, 0, 0, .45)
    }

    .col.l .node:hover {
      transform: translateX(4px)
    }

    .col.r .node:hover {
      transform: translateX(-4px)
    }

    .ic {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--gold-faint);
      color: var(--gold-2);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      padding: 8px
    }

    .nt {
      flex: 1;
      min-width: 0
    }

    .nt strong {
      display: block;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.15
    }

    .nt small {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px
    }

    .nchev {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: .6;
      color: var(--gold)
    }

    .nchev svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .hub {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 6px
    }

    .hubimg {
      position: relative;
      width: min(100%, 470px, 46vh);
      aspect-ratio: 350/228;
      animation: float 9s ease-in-out infinite
    }

    .hubimg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-mask-image: radial-gradient(ellipse 50% 49% at 50% 50%, #000 86%, transparent 100%);
      mask-image: radial-gradient(ellipse 50% 49% at 50% 50%, #000 86%, transparent 100%)
    }

    .hubcap {
      text-align: center
    }

    .hubcap strong {
      display: block;
      font-family: var(--display);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(18px, 1.7vw, 24px)
    }

    .hubcap span {
      font-size: 12.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible
    }

    .links path {
      fill: none;
      stroke: var(--gold);
      stroke-opacity: .32;
      stroke-width: 1;
      transition: stroke-opacity .3s, stroke-width .3s
    }

    .links path.flow {
      stroke-opacity: .45;
      stroke-dasharray: 3 7;
      animation: flow 2.4s linear infinite
    }

    .links circle {
      fill: var(--gold);
      fill-opacity: .7
    }

    .links .on {
      stroke-opacity: 1;
      stroke-width: 1.6
    }

    .links circle.on {
      fill-opacity: 1
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -20
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-5px)
      }
    }

    /* ---------- band 3: loop ---------- */
    .loop {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) auto minmax(0, .7fr);
      align-items: center;
      gap: clamp(8px, 2vw, 32px);
      padding-block: clamp(4px, 1vh, 12px) clamp(10px, 1.8vh, 24px)
    }

    .lphoto {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: -1
    }

    .lphoto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
      mask-image: linear-gradient(90deg, transparent, #000 40%)
    }

    .lsteps {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 4px;
      min-width: 0
    }

    .lsteps li {
      min-width: 0
    }

    .lsteps li.arr {
      flex: 1 1 14px;
      align-self: flex-start;
      margin-top: calc(var(--cs)/2 - 7px);
      color: var(--gold);
      opacity: .7;
      max-width: 60px
    }

    .lsteps li.arr svg {
      width: 100%;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .lp {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: clamp(78px, 9vw, 126px);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: center
    }

    .circ {
      width: var(--cs);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: calc(var(--cs)*.27);
      color: var(--text);
      background: rgba(24, 21, 17, .8);
      border: 1px solid var(--gold-dim);
      transition: .3s;
      animation: pulse 9s infinite;
      animation-delay: calc(var(--i)*1.5s)
    }

    .circ svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .lp:hover .circ,
    .lp:focus-visible .circ {
      border-color: var(--gold);
      background: rgba(40, 33, 24, .95);
      box-shadow: 0 0 0 5px var(--gold-faint);
      transform: translateY(-3px)
    }

    .ll {
      font-size: clamp(13px, 1.15vw, 16px);
      line-height: 1.25
    }

    .ll b {
      display: block;
      font-weight: 500;
      font-size: clamp(14px, 1.3vw, 17.5px)
    }

    .ll span {
      color: var(--muted)
    }

    @keyframes pulse {

      0%,
      18%,
      100% {
        box-shadow: 0 0 0 0 rgba(212, 175, 106, 0)
      }

      6% {
        box-shadow: 0 0 0 7px rgba(212, 175, 106, .22);
        border-color: var(--gold)
      }
    }

    .ring {
      position: relative;
      width: clamp(120px, min(15vw, 24vh), 220px);
      aspect-ratio: 1;
      display: grid;
      place-items: center
    }

    .ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--gold);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: spin 50s linear infinite;
      filter: drop-shadow(0 0 6px rgba(212, 175, 106, .45))
    }

    .ring p {
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(19px, 1.9vw, 28px);
      line-height: 1.15;
      text-align: center;
      max-width: 7em
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ---------- preview card ---------- */
    .pop {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      width: min(380px, calc(100vw - 24px));
      background: rgba(21, 18, 15, .97);
      border: 1px solid var(--gold-dim);
      border-radius: 20px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .65), 0 0 0 1px rgba(0, 0, 0, .4);
      backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(6px) scale(.98);
      pointer-events: none;
      transition: opacity .16s, transform .16s;
      overflow: hidden
    }

    .pop.on {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      cursor: pointer
    }

    .pop[hidden] {
      display: none
    }

    .pp-h {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 10px
    }

    .pp-h strong {
      font-size: 15.5px;
      font-weight: 600;
      display: block;
      line-height: 1.15
    }

    .pp-h small {
      font-size: 12.5px;
      color: var(--muted)
    }

    .pp-b {
      padding: 0 16px 6px
    }

    .pp-f {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--gold-2);
      background: rgba(212, 175, 106, .06)
    }

    .pp-f svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .rw {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      font-size: 13.5px
    }

    .rw:first-child {
      border-top: 0
    }

    .rw span:first-child {
      min-width: 0
    }

    .rw .v {
      color: var(--muted);
      white-space: nowrap
    }

    .tot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 8px 0 6px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--gold-dim);
      background: var(--gold-faint);
      font-weight: 600
    }

    .tot .v {
      color: var(--gold-2);
      font-size: 16px
    }

    .cap {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
      padding: 4px 0 8px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      border: 1px solid var(--gold-dim);
      background: var(--gold-faint);
      color: var(--gold-2);
      white-space: nowrap
    }

    .chip.may {
      background: transparent;
      border-style: dashed;
      color: var(--muted)
    }

    .chip.sm {
      padding: 1px 8px;
      font-size: 11.5px
    }

    .lbl {
      font-size: 11.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 8px 0 6px
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, var(--gold));
      flex-shrink: 0
    }

    .dot.ok {
      background: var(--ok)
    }

    .dot.warn {
      background: var(--warn)
    }

    .dot.bad {
      background: var(--bad)
    }

    .dot.high {
      background: var(--bad)
    }

    .dot.med {
      background: var(--warn)
    }

    .mini {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 70px;
      padding-top: 6px
    }

    .mini i {
      flex: 1;
      height: var(--h);
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--gold-2), #8f6d38);
      transform-origin: bottom;
      animation: growy .6s both
    }

    .mini i.pk {
      background: linear-gradient(180deg, #fff2cf, var(--gold))
    }

    .mdays {
      display: flex;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .mdays span {
      flex: 1;
      text-align: center
    }

    .cv {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .cvbar {
      width: 54px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden
    }

    .cvbar i {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: 3px;
      background: var(--c);
      transform-origin: left;
      animation: growx .6s both
    }

    .k2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 2px 0 8px
    }

    .k2 div {
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line)
    }

    .k2 span {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .k2 b {
      font-size: 18px;
      font-weight: 600
    }

    @keyframes growx {
      from {
        transform: scaleX(0)
      }
    }

    @keyframes growy {
      from {
        transform: scaleY(0)
      }
    }

    /* ---------- full sheet ---------- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(5, 4, 3, .74);
      backdrop-filter: blur(8px)
    }

    .sheet {
      position: relative;
      width: min(1100px, 100%);
      height: min(840px, 100%);
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #1b1713, #0f0d0b);
      border: 1px solid var(--gold-dim);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 50px 120px rgba(0, 0, 0, .7)
    }

    .sh {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 17, 14, .9);
      flex-shrink: 0
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 0 1 auto
    }

    .pill .pt {
      min-width: 0
    }

    .pill strong {
      display: block;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.15
    }

    .pill small {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mnav {
      display: flex;
      gap: 6px;
      margin-left: auto;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px
    }

    .mnav::-webkit-scrollbar {
      display: none
    }

    .mnav button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, .04);
      color: var(--muted);
      padding: 9px;
      cursor: pointer;
      flex-shrink: 0;
      transition: .2s
    }

    .mnav button svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .mnav button:hover {
      color: var(--text);
      border-color: var(--gold-dim)
    }

    .mnav button[aria-current="true"] {
      color: var(--gold-2);
      border-color: var(--gold);
      background: var(--gold-faint)
    }

    .x {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05);
      padding: 10px;
      cursor: pointer;
      flex-shrink: 0
    }

    .x svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--text);
      stroke-width: 1.8;
      stroke-linecap: round
    }

    .x:hover {
      border-color: var(--gold)
    }

    .sb {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      align-items: start
    }

    .hero {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border-right: 1px solid var(--line);
      min-width: 0
    }

    .himg {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #000
    }

    .himg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: kb 18s ease-in-out infinite alternate
    }

    @keyframes kb {
      from {
        transform: scale(1)
      }

      to {
        transform: scale(1.08)
      }
    }

    .hshade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(8, 6, 4, .88))
    }

    .hcap {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px
    }

    .hcap small {
      display: block;
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--gold-2)
    }

    .hcap strong {
      font-family: var(--display);
      font-style: italic;
      font-weight: 500;
      font-size: 23px;
      line-height: 1.1
    }

    .kpis {
      display: grid;
      gap: 8px
    }

    .kpi {
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line)
    }

    .kpi span {
      display: block;
      font-size: 11.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .kpi b {
      display: block;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.15;
      color: var(--gold-2)
    }

    .kpi em {
      display: block;
      font-style: normal;
      font-size: 12.5px;
      color: var(--muted)
    }

    .main {
      padding: 22px 28px 34px;
      min-width: 0;
      display: grid;
      gap: 22px
    }

    .sec h3 {
      font-family: var(--display);
      font-weight: 600;
      font-size: 25px;
      line-height: 1.1;
      margin-bottom: 10px
    }

    .sec p.lead {
      color: var(--muted);
      max-width: 60ch
    }

    .samp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--warn);
      border: 1px dashed rgba(212, 168, 75, .5);
      border-radius: 999px;
      padding: 4px 12px;
      width: fit-content
    }

    .tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      width: fit-content;
      max-width: 100%
    }

    .tabs button {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500
    }

    .tabs button[aria-selected="true"] {
      background: var(--gold);
      color: #1a1409
    }

    .strip {
      display: flex;
      gap: 3px;
      height: 16px;
      border-radius: 8px;
      overflow: hidden
    }

    .strip i {
      flex: 0 0 auto;
      width: var(--w);
      background: var(--c);
      transform-origin: left;
      animation: growx .8s .25s both
    }

    .tbl {
      display: grid
    }

    .tr {
      display: grid;
      grid-template-columns: var(--cols);
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 14.5px
    }

    .tr.th {
      border-top: 0;
      padding: 0 0 8px;
      font-size: 11.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .tr .num {
      text-align: right;
      white-space: nowrap
    }

    .tr .nm {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 500
    }

    .tr .mu {
      color: var(--muted)
    }

    .tr.sum {
      border-top: 1px solid var(--gold-dim);
      font-weight: 600
    }

    .big {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--gold-dim);
      background: var(--gold-faint);
      font-weight: 600;
      font-size: 17px
    }

    .big b {
      font-size: 28px;
      color: var(--gold-2);
      font-weight: 600
    }

    .note {
      font-size: 12.5px;
      color: var(--muted)
    }

    .bar {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .07);
      overflow: hidden;
      min-width: 40px
    }

    .bar i {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: 4px;
      background: var(--c, var(--gold));
      transform-origin: left;
      animation: growx .8s .25s both
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px
    }

    .card {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      display: grid;
      gap: 8px;
      align-content: start
    }

    .card h4 {
      margin: 0;
      font-size: 17px;
      font-weight: 600
    }

    .card .it {
      color: var(--muted);
      font-size: 14px
    }

    .ag {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px
    }

    .ag div {
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 13.5px;
      display: grid;
      gap: 2px;
      color: var(--muted)
    }

    .ag div.c {
      border-color: var(--gold);
      background: var(--gold-faint);
      color: var(--text)
    }

    .ag div.m {
      border-style: dashed;
      border-color: var(--gold-dim)
    }

    .ag small {
      font-size: 11.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .ag .c small {
      color: var(--gold-2)
    }

    .plot {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(6px, 1.4vw, 14px);
      height: 210px;
      padding-top: 26px;
      border-bottom: 1px solid var(--line)
    }

    .dc {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px
    }

    .bv {
      position: relative;
      width: min(34px, 40%);
      height: calc(var(--h)*1%);
      border-radius: 6px 6px 0 0;
      background: linear-gradient(180deg, var(--gold-2), #8f6d38);
      transform-origin: bottom;
      animation: growy .7s .2s both
    }

    .bv.f {
      background: rgba(255, 255, 255, .14);
      width: min(18px, 22%)
    }

    .bv span {
      position: absolute;
      left: 50%;
      top: -20px;
      transform: translateX(-50%);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap
    }

    .bv.f span {
      display: none
    }

    .tick {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: calc(var(--t)*1%);
      height: 0;
      border-top: 2px dashed rgba(255, 255, 255, .55)
    }

    .dl {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(6px, 1.4vw, 14px);
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      padding-top: 6px
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .legend i {
      display: inline-block;
      width: 14px;
      height: 8px;
      border-radius: 3px
    }

    .steps {
      display: grid;
      gap: 10px;
      counter-reset: s
    }

    .steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      counter-increment: s
    }

    .steps li::before {
      content: counter(s);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      color: var(--gold-2);
      font-weight: 600
    }

    .steps b {
      display: block;
      font-weight: 600
    }

    .steps span {
      color: var(--muted);
      font-size: 14px
    }

    .chk {
      display: grid;
      gap: 8px
    }

    .chk label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .03);
      cursor: pointer;
      transition: .2s
    }

    .chk label:hover {
      border-color: var(--gold-dim)
    }

    .chk input {
      width: 20px;
      height: 20px;
      accent-color: var(--gold);
      flex-shrink: 0
    }

    .chk label.done {
      border-color: var(--gold-dim);
      background: var(--gold-faint)
    }

    .chk label.done span {
      color: var(--muted);
      text-decoration: line-through
    }

    .prog {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--muted)
    }

    .prog .bar {
      flex: 1
    }

    .call {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--gold-dim);
      background: var(--gold-faint);
      display: flex;
      gap: 12px;

      }

      .links {

      }

      }

      }

        const done = () => { modal.hidden = true; isOpen = false; closing = false; document.documentElement.classList.remove('lock'); noPop = true; setTimeout(() => noPop = false, 500); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }) };
        if (!o.silent) { try { if (location.hash) location.hash = '' } catch (e) { } }
        const from = $(`.node[data-m="${cur}"]`) || lastFocus;
        if (!reduce && from && from.getBoundingClientRect) {
          const R = sheet.getBoundingClientRect(), N = from.getBoundingClientRect(), rad = parseFloat(getComputedStyle(sheet).borderTopLeftRadius) || 0;
          const dx = N.left + N.width / 2 - (R.left + R.width / 2), dy = N.top + N.height / 2 - (R.top + R.height / 2), ix = Math.max(0, (R.width - N.width) / 2), iy = Math.max(0, (R.height - N.height) / 2);
          [$('#sh'), sb].forEach(e => e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
          $('#scrim').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, delay: 120, fill: 'forwards' });
          const a = sheet.animate([{ transform: 'translate(0,0)', clipPath: `inset(0px 0px round ${rad}px)` }, { transform: `translate(${dx}px,${dy}px)`, clipPath: `inset(${iy}px ${ix}px round ${Math.min(N.height / 2, 999)}px)` }], { duration: 460, delay: 80, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'forwards' });
          a.onfinish = () => { a.cancel(); $$('#scrim,#sh,#sb').forEach(e => e.getAnimations().forEach(x => x.cancel())); done() };
        } else done();
      }
      function switchTo(k, o = {}) {
        if (!isOpen || k === cur) return; cur = k;
        if (!o.silent) setHash(k);
        paint(k);
        if (!reduce) sb.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240 });
      }
      $('#mClose').addEventListener('click', () => closeModal());
      $('#scrim').addEventListener('click', () => closeModal());
      $('#mNav').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) switchTo(b.dataset.go) });
      sb.addEventListener('click', e => {
        const t = e.target.closest('[role="tab"]');
        if (t) { tabs[cur] = t.dataset.tab; const y = sb.scrollTop; paint(cur, true); sb.scrollTop = y }
      });
      sb.addEventListener('change', e => {
        const c = e.target.closest('[data-c]'); if (!c) return;
        chk[+c.dataset.c] = c.checked; c.closest('label').classList.toggle('done', c.checked);
        const n = chk.filter(Boolean).length; $('#chkn').textContent = `${n} of ${CHK.length} done`; $('#chkb').style.setProperty('--w', (n / CHK.length * 100) + '%');
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { if (isOpen) closeModal(); else hidePop(); return }
        if (!isOpen) return;
        if (e.key === 'Tab') {
          const f = $$('button,input,[href]', sheet).filter(x => !x.disabled && x.offsetParent !== null); if (!f.length) return;
          const a = f[0], z = f[f.length - 1];
          if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus() }
          else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus() }
        }
        if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input')) {
          const i = ORDER.indexOf(cur), n = ORDER[(i + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length]; switchTo(n);
        }
      });
      function route() {
        const k = location.hash.slice(1);
        if (MODS[k]) { if (!isOpen) openModal(k, null, { silent: true }); else switchTo(k, { silent: true }) }
        else if (isOpen) closeModal({ silent: true });
      }
      addEventListener('hashchange', route);
/* ---- listeners ---- */
const rp=()=>{const y=sb.scrollTop;paint(cur,true);$$('.rise',sb).forEach(e=>e.style.animation='none');sb.scrollTop=y};

 const a=e.target.closest('[data-al]');if(a){alSel=a.dataset.al;rp();return}
 const q=e.target.closest('[data-q]');if(q){const[i,j]=q.dataset.q.split(':').map(Number);QZ[i]=j;rp();return}
 const p=e.target.closest('[data-trp]');if(p)setTR(+p.dataset.trp);
});

 const c=e.target.closest('[data-cnt]');if(c){const v=parseFloat(c.value);if(isNaN(v))delete INV[c.dataset.cnt];else INV[c.dataset.cnt]={cnt:v,h:0};rp();return}
 const n=e.target.closest('[data-ns]');if(n){NS[n.dataset.ns]=n.dataset.ns==='p'?n.value:parseFloat(n.value)||0;rp();return}
 if(e.target.closest('[data-c]')){$$('[data-gp]',sb).forEach(x=>x.textContent=gcount(x.dataset.gp));const r=$('#rdy');if(r)r.hidden=chk.some(x=>!x);const k=$$('.kpi b',sb)[2];if(k)k.textContent=chk.filter(Boolean).length+' of '+CHK.length}
});

      route();
    })();
