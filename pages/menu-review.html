<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu review — Inn Collection Group</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171513;
      --bg-card: #1f1c19;
      --bg-sub: #191714;
      --border: #35312c;
      --white: #ece7df;
      --gray: #8c867d;
      --gray-hi: #b9b3a9;
      --accent: #e07b4a;
      --ok: #85c99c;
      --err: #f28b82;
      --warn: #e6b450;
      --info: #8ab4f8;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --sbw: 310px;
      --mdw: 46%
    }

    * {
      box-sizing: border-box;
      scrollbar-width: none;
      -ms-overflow-style: none
    }

    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font: 13px/1.5 var(--sans);
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button,
    select {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--info);
      outline-offset: 2px
    }

    header {
      flex: none;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px clamp(12px, 2vw, 24px)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .filters {
      margin-top: 10px
    }

    .spacer {
      flex: 1
    }

    .kicker {
      display: block;
      color: var(--accent);
      font: 11px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .ttl {
      font: 600 20px/1.15 var(--serif)
    }

    .nav {
      display: flex;
      gap: 2px;
      margin-left: 12px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 999px
    }

    .nav a {
      padding: 3px 12px;
      border-radius: 999px;
      color: var(--gray-hi);
      text-decoration: none;
      font-size: 12px
    }

    .nav a:hover {
      color: var(--white)
    }

    .nav a.on {
      background: rgba(224, 123, 74, .16);
      color: var(--white)
    }

    .prog {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gray-hi);
      font-size: 12px
    }

    .prog progress {
      width: 120px;
      height: 6px;
      accent-color: var(--ok)
    }

    .btn,
    .select,
    .search {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--white);
      border-radius: 6px;
      padding: 6px 10px;
      text-decoration: none;
      white-space: nowrap
    }

    .btn:hover,
    .select:hover {
      border-color: var(--gray)
    }

    .btn.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #111;
      font-weight: 600
    }

    .btn.sm {
      padding: 3px 9px;
      font-size: 12px
    }

    .btn.ok {
      border-color: rgba(133, 201, 156, .5);
      color: var(--ok)
    }

    .btn.bad {
      border-color: rgba(242, 139, 130, .5);
      color: var(--err)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .search {
      flex: 1 1 220px;
      min-width: 160px
    }

    .select {
      max-width: 210px
    }

    .search:focus,
    .select:focus,
    textarea:focus {
      border-color: var(--info);
      outline: none
    }

    .stat {
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--gray-hi);
      font-size: 12px
    }

    .stat b {
      color: var(--white);
      font-weight: 600
    }

    body.min .filters,
    body.min .prog,
    body.min .facts,
    body.min #review {
      display: none
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: flex
    }

    .sidebar {
      flex: none;
      width: var(--sbw);
      overflow: auto;
      background: var(--bg-sub)
    }

    .layout.sbcol .sidebar,
    .layout.sbcol #rzSide {
      display: none
    }

    .rz {
      flex: 0 0 6px;
      cursor: col-resize;
      border-left: 1px solid var(--border);
      transition: background .15s
    }

    .rz:hover,
    .rz.on {
      background: var(--accent)
    }

    .lh {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-sub);
      border-bottom: 1px solid var(--border);
      color: var(--gray);
      font: 11px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .mrow {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      padding: 10px 14px;
      color: var(--white)
    }

    .mrow:hover {
      background: var(--bg-card)
    }

    .mrow.selected {
      background: var(--bg-card);
      border-left-color: var(--accent)
    }

    .rt {
      display: block;
      font-weight: 600;
      font-size: 12.5px;
      line-height: 1.35;
      overflow-wrap: anywhere
    }

    .rv {
      display: block;
      color: var(--gray-hi);
      font-size: 11px;
      margin-top: 2px
    }

    .rm {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      color: var(--gray);
      font-size: 11px
    }

    .pill {
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      color: var(--gray-hi);
      font-size: 10.5px
    }

    .pill.reviewed {
      background: rgba(133, 201, 156, .15);
      color: var(--ok)
    }

    .pill.flagged {
      background: rgba(242, 139, 130, .15);
      color: var(--err)
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px clamp(12px, 2vw, 20px)
    }

    .empty {
      margin: auto;
      padding: 40px;
      color: var(--gray);
      text-align: center
    }

    h1 {
      font: 600 20px/1.25 var(--serif);
      margin: 0;
      overflow-wrap: anywhere
    }

    .fn {
      color: var(--gray);
      font: 12px var(--mono)
    }

    .fact {
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--gray-hi);
      font-size: 12px
    }

    .fact b {
      color: var(--white);
      font-weight: 600
    }

    #review {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 340px);
      gap: 10px
    }

    #review.col {
      display: none
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      padding: 12px 14px
    }

    .card h2 {
      font: 600 14px var(--serif);
      margin: 0 0 8px;
      color: var(--white)
    }

    .check {
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      display: inline-block;
      margin: 0 5px 5px 0;
      border: 1px solid var(--border);
      background: none;
      color: var(--gray-hi)
    }

    .check.warn {
      color: var(--warn);
      border-color: rgba(230, 180, 80, .4);
      background: rgba(230, 180, 80, .07)
    }

    .check.ok {
      color: var(--ok);
      border-color: rgba(133, 201, 156, .35)
    }

    .check.issue {
      cursor: pointer;
      vertical-align: top
    }

    .check.issue:hover {
      filter: brightness(1.2)
    }

    .check.resolved {
      color: var(--ok);
      border-color: rgba(133, 201, 156, .35);
      background: none
    }

    #pdfReview {
      flex: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-sub)
    }

    #pdfReview .sub {
      display: block;
      color: var(--gray);
      font-size: 11px;
      margin-bottom: 4px
    }

    .sub {
      color: var(--gray);
      font-size: 12px
    }

    dialog.issue-dialog {
      width: min(720px, calc(100vw - 28px));
      max-height: min(80vh, 760px);
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--white);
      box-shadow: 0 24px 80px #000b
    }

    dialog.issue-dialog::backdrop {
      background: #0009;
      backdrop-filter: blur(2px)
    }

    .issue-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border)
    }

    .issue-top h2 {
      flex: 1;
      margin: 0;
      font: 600 17px var(--serif)
    }

    .issue-content {
      padding: 14px 18px;
      max-height: calc(80vh - 150px);
      overflow: auto
    }

    .issue-content p {
      margin: 0 0 10px;
      color: var(--gray-hi)
    }

    .issue-content ul {
      padding-left: 22px;
      margin: 8px 0
    }

    .issue-content li {
      margin: 0 0 10px
    }

    .issue-content code {
      display: block;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #111;
      color: #e8e4de;
      border-left: 3px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      margin: 4px 0;
      font: 12px/1.5 var(--mono)
    }

    .md code {
      background: #111;
      color: #e8e4de;
      padding: 1px 5px;
      border-radius: 3px;
      font: 12px var(--mono)
    }

    .issue-content label {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-top: 6px;
      color: var(--gray-hi);
      font-size: 12px
    }

    .issue-content input[type=checkbox] {
      margin-top: 3px;
      accent-color: var(--accent)
    }

    .issue-note {
      margin-top: 12px
    }

    .issue-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
      padding: 12px 18px;
      border-top: 1px solid var(--border)
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 50px;
      max-height: 120px;
      background: var(--bg);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px
    }

    .ss {
      font-size: 11px;
      color: var(--gray)
    }

    .panes {
      flex: 1;
      min-height: 0;
      display: flex
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      overflow: hidden
    }

    #paneMd {
      flex: 0 0 var(--mdw)
    }

    #panePdf {
      flex: 1
    }

    .pane.col {
      flex: 0 0 36px !important
    }

    .pane.col .pb,
    .pane.col .pbtns,
    .pane.col #pdfReview {
      display: none
    }

    .pane.col .ph {
      writing-mode: vertical-rl;
      padding: 12px 6px;
      height: 100%;
      cursor: pointer
    }

    .pane.col .ph h2 {
      margin: 0
    }

    .panes .rz {
      border: 0;
      flex: 0 0 12px;
      position: relative;
      background: none
    }

    .panes .rz::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 50%;
      height: 44px;
      margin-top: -22px;
      width: 4px;
      border-radius: 4px;
      background: var(--gray);
      opacity: .5;
      box-shadow: -3px 0 var(--gray), 3px 0 var(--gray)
    }

    .panes .rz:hover::after,
    .panes .rz.on::after {
      background: var(--accent);
      box-shadow: -3px 0 var(--accent), 3px 0 var(--accent);
      opacity: 1
    }

    .panes.c1 .rz {
      display: none
    }

    .ph {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border)
    }

    .ph h2 {
      font: 600 14px var(--serif);
      margin: 0
    }

    .pbtns {
      display: flex;
      gap: 4px;
      align-items: center
    }

    .pb {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 16px
    }

    .md {
      line-height: 1.6;
      overflow-wrap: anywhere
    }

    .md h1 {
      font: 600 20px var(--serif);
      margin: 4px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border)
    }

    .md h2 {
      font: 600 15px var(--serif);
      margin: 20px 0 6px
    }

    .md h3,
    .md h4 {
      font-size: 13px;
      margin: 14px 0 5px
    }

    .md p {
      margin: 5px 0;
      color: var(--gray-hi)
    }

    .md ul {
      padding-left: 22px;
      margin: 6px 0
    }

    .md strong {
      color: var(--white)
    }

    .md [data-b] {
      cursor: pointer;
      border-radius: 4px;
      transition: background .12s
    }

    .md [data-b]:hover {
      background: rgba(138, 180, 248, .1)
    }

    .md .sel {
      background: rgba(224, 123, 74, .16) !important;
      box-shadow: -3px 0 0 var(--accent)
    }

    .md li {
      list-style: none;
      margin-left: -18px;
      padding: 4px 8px;
      border-radius: 6px
    }

    .md li::marker {
      content: ""
    }

    .hd {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 600
    }

    .pr {
      color: var(--warn);
      font-weight: 600;
      white-space: nowrap
    }

    .ds {
      color: var(--gray-hi);
      font-size: 12.5px
    }

    .src {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 12px/1.55 var(--mono);
      color: var(--gray-hi);
      margin: 0
    }

    #pdfBody {
      padding: 8px;
      background: #0f0e0d;
      position: relative
    }

    .pg {
      position: relative;
      margin: 0 auto 10px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .5)
    }

    .pg canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    .tl {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1
    }

    .tl span,
    .tl br {
      position: absolute;
      white-space: pre;
      color: transparent;
      cursor: pointer;
      transform-origin: 0 0
    }

    .tl span:hover {
      background: rgba(138, 180, 248, .2)
    }

    .tl ::selection {
      background: rgba(138, 180, 248, .35)
    }

    .hl {
      position: absolute;
      pointer-events: none;
      background: rgba(240, 120, 50, .28);
      outline: 2px solid rgba(205, 91, 28, .9);
      border-radius: 3px;
      mix-blend-mode: multiply;
      animation: pulse .9s ease-out 2
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(224, 123, 74, .8)
      }

      100% {
        box-shadow: 0 0 0 14px rgba(224, 123, 74, 0)
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .hl {
        animation: none
      }
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0f0e0d
    }

    .note {
      color: var(--gray);
      text-align: center;
      padding: 30px
    }

    #insp {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      padding: 8px 12px;
      font-size: 12px
    }

    #insp .t {
      color: var(--gray);
      flex: 1 1 100%;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .chip {
      padding: 1px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--gray-hi)
    }

    .chip.price {
      border-color: rgba(230, 180, 80, .45);
      color: var(--warn)
    }

    .chip.tag {
      border-color: rgba(133, 201, 156, .4);
      color: var(--ok)
    }

    .chip.bad {
      border-color: rgba(242, 139, 130, .5);
      color: var(--err)
    }

    .chip.hit {
      border-color: rgba(138, 180, 248, .45);
      color: var(--info)
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--gray-hi);
      font-size: 12px
    }

    .hidden {
      display: none !important
    }

    @media(max-width:860px) {
      body {
        overflow: auto;
        display: block;
        height: auto
      }

      .layout {
        display: block
      }

      .sidebar {
        width: auto;
        max-height: 34vh
      }

      #rzSide,
      .panes .rz {
        display: none
      }

      .main {
        display: block
      }

      .panes {
        display: block
      }

      .pane {
        margin-bottom: 10px;
        flex: none !important;
        height: 70vh
      }

      #review {
        grid-template-columns: 1fr
      }

      .nav {
        margin-left: 0
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <button class="btn sm" id="bSide" title="Toggle sidebar ( [ )" aria-label="Toggle sidebar">☰</button>
      <div><span class="kicker">Inn Collection Group</span>
        <div class="ttl">Menu review</div>
      </div>
      <nav class="nav" aria-label="Pages"><a class="on" href="menu-review.html" aria-current="page">Menu review</a><a
          href="discovered-media.html">Discovered media</a><a href="fnb-crosscheck.html">F&amp;B role cross-check</a><a
          href="launch-readiness.html">Launch readiness</a><a href="product-data.html">Product data</a><a
          href="menu-explorer.html">Menu explorer</a></nav>
      <span class="spacer"></span>
      <div class="prog"><progress id="reviewProgress" value="0" max="1" aria-label="Reviewed menus"></progress><span
          class="stat"><b id="reviewedCount">0</b> of <b id="totalCount">—</b> reviewed</span><span class="stat"><b
            id="flaggedCount">0</b> flagged</span></div>
      <button class="btn sm" id="bMin" title="Minimal view ( m )">Minimal</button>
    </div>
    <div class="row filters">
      <input id="search" class="search" type="search" placeholder="Search menus, venues or filename… ( / )"
        autocomplete="off">
      <select id="regionFilter" class="select" aria-label="Region">
        <option value="all">All regions</option>
      </select>
      <select id="venueFilter" class="select" aria-label="Venue">
        <option value="all">All venues</option>
      </select>
      <select id="kindFilter" class="select" aria-label="Menu type">
        <option value="all">All menu types</option>
        <option>Food</option>
        <option>Drinks</option>
        <option>Sunday</option>
        <option>Events</option>
        <option>Other</option>
      </select>
      <select id="statusFilter" class="select" aria-label="Review status">
        <option value="all">All review statuses</option>
        <option value="pending">Needs review</option>
        <option value="reviewed">Reviewed</option>
        <option value="flagged">Flagged</option>
      </select>
      <button class="btn sm" id="bReset" title="Clear filters">Clear</button>
      <span id="visibleCount" class="stat">Loading…</span>
    </div>
  </header>
  <div class="layout" id="layout">
    <aside class="sidebar" aria-label="Menus">
      <div class="lh"><span>MENU FILES</span><span id="listCount">—</span></div>
      <div id="menuList"></div>
    </aside>
    <div class="rz" id="rzSide" title="Drag to resize"></div>
    <main class="main">
      <div id="head" class="row"></div>
      <div class="row facts" id="facts"></div>
      <section id="review"></section>
      <div class="panes" id="panes">
        <section class="pane" id="paneMd">
          <div class="ph" data-col="md">
            <h2>Extracted markdown</h2>
            <div class="pbtns"><button class="btn sm on" data-view="rendered">Rendered</button><button class="btn sm"
                data-view="source">Source</button><button class="btn sm" data-toggle="md" title="Collapse">–</button>
            </div>
          </div>
          <div class="pb" id="mdBody">
            <div class="empty">Loading menus...</div>
          </div>
        </section>
        <div class="rz" id="rzPane" title="Drag to resize"></div>
        <section class="pane" id="panePdf">
          <div class="ph" data-col="pdf">
            <h2>Original PDF</h2>
            <div class="pbtns"><button class="btn sm" id="zOut">−</button><button class="btn sm" id="zIn">+</button><a
                class="btn sm" id="pdfOpen" target="_blank" rel="noopener">Open PDF</a><button class="btn sm"
                data-toggle="pdf" title="Collapse">–</button></div>
          </div>
          <div id="pdfReview"></div>

    /* ---------- header / detail ---------- */
    function analyze(text, hasPdf) {
      const L = text.split(/\r?\n/), heads = L.filter(l => /^#{1,6}\s/.test(l)).length, items = L.filter(l => /^\s*[-*+]\s+/.test(l)).length, words = text.trim().split(/\s+/).filter(Boolean).length;

      const m = menus.find(x => x.name === current);
      analyze(md, m?.hasPdf ?? false).repeatedLines.forEach((group, index) => {
        const target = $(`[data-pdf-location="${index}"]`, $("#issueContent"));
        if (!target) return;
        const match = pdfOK ? findInPdf(group.text.split(/\s+/).slice(0, 14).join(" "), 0) : null;
        target.textContent = match ? `PDF text match: page ${match.page + 1}` : pdfFailed ? "PDF text locations unavailable" : "No text match found in the PDF";
      });
    }
    let PDF_MAP = {};
    let SEED_REVIEWS = [];

    async function sha256Hex(str) {
      try {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {
        return "";
      }
    }

    function resolvePdfUrl(name) {
      if (PDF_MAP && PDF_MAP[name]) return PDF_MAP[name];
      const stem = name.replace(/\.md$/i, "");
      return "documents/extracted-to-md/" + encodeURIComponent(stem) + ".pdf";
    }

    async function saveIssueReview(issueId, status) {
      try {
        const note = $("#issueNote").value;
        issueReviews[issueId] = { status, note };
        fetch("/api/issues", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: current, issueId, status, note, sourceHash: issueHash }) }).catch(() => null);
        renderHead(); $("#issueDialog").close(); toast("Issue review saved.");
      } catch (error) { toast("Could not save issue review: " + (error instanceof Error ? error.message : String(error))) }
    }
    async function removeRepeatedLines() {
      const lineNumbers = $$('input[name="removeLine"]:checked', $("#issueContent")).map(input => +input.value);
      if (!lineNumbers.length) { toast("Select at least one repeated line to remove."); return }
      const name = current;
      const note = $("#issueNote").value;
      try {
        let updatedRemotely = false;
        try {
          const response = await fetch("/api/issues/fix-duplicates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, sourceHash: issueHash, lineNumbers, note }) });
          if (response.ok) {
            updatedRemotely = true;
            $("#issueDialog").close(); await openMenu(name);
            toast(`Removed duplicate lines from the Markdown file.`);
            return;
          }
        } catch (e) { }
        // Client-side fallback
        const lines = md.split(/\r?\n/);
        const lineSet = new Set(lineNumbers);
        const newLines = lines.filter((_, idx) => !lineSet.has(idx + 1));
        md = newLines.join("\n");
        blocks = parse(md);
        issueHash = await sha256Hex(md);
        issueReviews["repeated_lines"] = { status: "fixed", note: note || `Removed duplicate lines: ${lineNumbers.join(", ")}` };
        renderHead();
        $("#mdBody").innerHTML = `<div id="mdR" class="md">${renderMd()}</div><pre id="mdS" class="src hidden">${esc(md)}</pre>`;
        $("#issueDialog").close();
        toast(`Removed ${lineNumbers.length} duplicate line(s).`);
      } catch (error) { toast("Could not update the Markdown: " + (error instanceof Error ? error.message : String(error))) }
    }
    $("#issueClose").onclick = () => $("#issueDialog").close();
    $("#issueDialog").addEventListener("click", e => { if (e.target === $("#issueDialog")) $("#issueDialog").close() });
    $("#issueDialog").addEventListener("close", () => { openIssueId = null });
    function step(d) { const v = visibleMenus(), i = v.findIndex(m => m.name === current); if (v[i + d]) openMenu(v[i + d].name) }
    async function openMenu(name) {
      current = name; sel = null; issueHash = ""; issueReviews = {}; pdfTok++; pdfOK = false; renderList(); $("#insp").classList.add("hidden"); $("#mdBody").innerHTML = '<div class="empty">Loading menu...</div>';
      const m = menus.find(x => x.name === name);
      try {
        let r = await fetch("/api/menu" + qs(name), { cache: "no-store" }).catch(() => null);
        let ir = await fetch("/api/issues" + qs(name), { cache: "no-store" }).catch(() => null);
        let t = "", menuHash = "";
        if (r && r.ok) {
          t = await r.text();
          menuHash = r.headers.get("X-Source-Hash") || "";
        } else {
          const fb = await fetch("menus_md/" + encodeURIComponent(name), { cache: "no-store" });
          if (!fb.ok) throw new Error("Could not load menu (" + fb.status + ")");
          t = await fb.text();
          menuHash = await sha256Hex(t);
        }
        if (current !== name) return;
        const review = (ir && ir.ok) ? await ir.json().catch(() => null) : null;
        md = t; blocks = parse(md); m.bytes = new TextEncoder().encode(md).length;
        issueHash = menuHash;
        if (review && review.decisions) { issueReviews = review.decisions }
        else {
          try {
            const seeded = SEED_REVIEWS.find(s => s.menu_name === current);
            if (seeded && seeded.source_hash === issueHash) {
              issueReviews[seeded.issue_id] = { status: seeded.status, note: seeded.note };
            }
          } catch (e) { }
          const seeded = SEED_REVIEWS.find(s => s.menu_name === current && s.source_hash === issueHash);
          if (seeded) issueReviews[seeded.issue_id] = { status: seeded.status, note: seeded.note };
        }
        renderHead();
        $("#mdBody").innerHTML = `<div id="mdR" class="md">${renderMd()}</div><pre id="mdS" class="src hidden">${esc(md)}</pre>`;
        $$("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === "rendered"));
        const pdfUrl = resolvePdfUrl(name);
        $("#pdfOpen").classList.toggle("hidden", !m.hasPdf); $("#pdfOpen").href = pdfUrl;
        loadPdf(m);
      } catch (e) { if (current === name) $("#mdBody").innerHTML = `<div class="empty">Could not load this menu: ${esc(e.message)}</div>` }
    }
    $("#menuList").onclick = e => { const b = e.target.closest("[data-name]"); if (b) openMenu(b.dataset.name) };
    $$("[data-view]").forEach(b => b.onclick = () => { const s = b.dataset.view === "source"; $("#mdR")?.classList.toggle("hidden", s); $("#mdS")?.classList.toggle("hidden", !s); $$("[data-view]").forEach(t => t.classList.toggle("on", t === b)) });

    /* ---------- PDF (pdf.js, with native iframe fallback) ---------- */
    const CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    let pdfjsP;
    const ensurePdfjs = () => pdfjsP || (pdfjsP = new Promise((ok, no) => {
      if (window.pdfjsLib) return ok(); const s = document.createElement("script"); s.src = CDN + "pdf.min.js"; s.onerror = () => no(new Error("pdf.js could not be loaded"));
      s.onload = async () => { try { const t = await (await fetch(CDN + "pdf.worker.min.js")).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: "text/javascript" })); ok() } catch (e) { no(e) } }; document.head.appendChild(s)
    }));
    async function loadPdf(m) {
      const tk = ++pdfTok, box = $("#pdfBody"); pdfDoc = null; pdfPages = []; pdfText = []; pdfOK = false; pdfFailed = false;
      if (!m.hasPdf) { pdfFailed = true; box.innerHTML = '<div class="note">No matching PDF was found in the extracted-to-md folder.</div>'; updateIssuePdfLocations(); return }
      box.innerHTML = '<div class="note">Loading PDF...</div>';
      const pdfUrl = resolvePdfUrl(m.name);
      try {
        await ensurePdfjs(); const doc = await pdfjsLib.getDocument(pdfUrl).promise; if (tk !== pdfTok) return;
        const pgs = [], txt = [];
        for (let n = 1; n <= doc.numPages; n++) {
          const p = await doc.getPage(n), tc = await p.getTextContent(); pgs.push(p);
          const items = tc.items.filter(i => i.str && i.str.trim()), tokens = []; items.forEach((it, ix) => tok(it.str).forEach(t => tokens.push({ ...t, it: ix }))); txt.push({ tc, items, tokens })
        }
        if (tk !== pdfTok) return; pdfDoc = doc; pdfPages = pgs; pdfText = txt; pdfOK = true; await buildPdf(tk); updateIssuePdfLocations();
      } catch (e) {
        if (tk !== pdfTok) return; pdfFailed = true; box.innerHTML = `<iframe class="pdf-frame" title="Original PDF" src="${pdfUrl}"></iframe>`; updateIssuePdfLocations();
        toast("Showing native PDF viewer.");
      }
    }
    async function buildPdf(tk) {
      const box = $("#pdfBody"); if (!pdfOK || box.clientWidth < 50) return; pdfW = box.clientWidth; box.innerHTML = ""; pdfPages.forEach(() => 0);
      const dpr = window.devicePixelRatio || 1, W = pdfW - 18;
      for (let i = 0; i < pdfPages.length; i++) {
        const p = pdfPages[i], v1 = p.getViewport({ scale: 1 }), sc = W / v1.width * pdfZoom, vp = p.getViewport({ scale: sc });
        const d = document.createElement("div"); d.className = "pg"; d.style.width = vp.width + "px"; d.style.height = vp.height + "px";
        const c = document.createElement("canvas"); c.width = vp.width * dpr; c.height = vp.height * dpr;
        const t = document.createElement("div"); t.className = "tl"; const h = document.createElement("div"); h.style.cssText = "position:absolute;inset:0;pointer-events:none";
        d.append(c, t, h); box.appendChild(d); pdfPages[i]._v = { d, h, vp };
        p.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise.catch(() => { });
        try { pdfjsLib.renderTextLayer({ textContentSource: pdfText[i].tc, container: t, viewport: vp, textDivs: [] }) } catch (e) { }
      }
      if (tk !== pdfTok) return; drawHl(false); updateIssuePdfLocations();
    }
    let rsT; new ResizeObserver(() => { clearTimeout(rsT); rsT = setTimeout(() => { const w = $("#pdfBody").clientWidth; if (pdfOK && w > 50 && Math.abs(w - pdfW) > 20) buildPdf(pdfTok) }, 250) }).observe($("#pdfBody"));
    $("#zIn").onclick = () => { pdfZoom = Math.min(3, pdfZoom + .2); buildPdf(pdfTok) }; $("#zOut").onclick = () => { pdfZoom = Math.max(.4, pdfZoom - .2); buildPdf(pdfTok) };

    /* ---------- matching text → PDF ---------- */
    const STRIP = /\(?\s*NGCI\s+Available\s*\)?/ig;
    function scan(q, pgs) {
      const m = q.length; let best = null;
      for (const pi of pgs) {
        const P = pdfText[pi].tokens, n = P.length;
        for (let i = 0; i + m <= n; i++) { let k = 0; while (k < m && P[i + k].w === q[k]) k++; if (k === m) { return { page: pi, a: i, b: i + m - 1, score: 1, exact: true } } }
        const L = Math.min(n, m + 4);
        for (let i = 0; i + L <= n; i++) {
          const cnt = {}; q.forEach(w => cnt[w] = (cnt[w] || 0) + 1); let hit = 0, f = -1, l = -1;
          for (let j = i; j < i + L; j++) { const w = P[j].w; if (cnt[w] > 0) { cnt[w]--; hit++; if (f < 0) f = j; l = j } }
          if (!hit) continue; const sc = hit / m - (l - f + 1 - hit) * .003; if (!best || sc > best.score) best = { page: pi, a: f, b: l, score: sc, exact: false }
        }
      }
      return best;
    }
    function findInPdf(text, hint) {
      const q = tok(text.replace(STRIP, " ")).map(t => t.w).filter(w => w.length > 1 || /\d/.test(w)), m = q.length; if (!m) return null;
      const all = pdfText.map((_, i) => i); let r = hint && pdfText[hint - 1] ? scan(q, [hint - 1]) : null;
      if (!r || r.score < .75) { const r2 = scan(q, all); if (r2 && (!r || r2.score > r.score)) r = r2 }
      return r && r.score >= (m < 3 ? 1 : .6) ? r : null;
    }
    function rects(mt) {
      const pg = pdfPages[mt.page]?._v; if (!pg) return []; const pt = pdfText[mt.page], by = new Map();
      for (let i = mt.a; i <= mt.b; i++) { const t = pt.tokens[i], c = by.get(t.it); c ? (c[0] = Math.min(c[0], t.s), c[1] = Math.max(c[1], t.e)) : by.set(t.it, [t.s, t.e]) }
      return [...by].map(([ix, [s, e]]) => {
        const it = pt.items[ix], tx = pdfjsLib.Util.transform(pg.vp.transform, it.transform), h = Math.hypot(tx[2], tx[3]), w = it.width * pg.vp.scale, L = it.str.length;
        return { page: mt.page, x: tx[4] + w * s / L - 3, y: tx[5] - h * .95, w: Math.max(8, w * (e - s) / L) + 6, h: h * 1.2 }
      });
    }
    function drawHl(scroll) {
      pdfPages.forEach(p => { if (p._v) p._v.h.innerHTML = "" }); if (!sel || !pdfOK) return; let first = null;
      sel.matches.forEach(mt => rects(mt).forEach(r => { const d = document.createElement("div"); d.className = "hl"; d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`; pdfPages[r.page]._v.h.appendChild(d); if (!first || (r.page < first.page || (r.page === first.page && r.y < first.y))) first = r }));
      if (scroll && first) { const b = $("#pdfBody"), pg = pdfPages[first.page]._v.d; b.scrollTo({ top: pg.offsetTop + first.y - b.clientHeight / 3, behavior: "smooth" }) }
    }

    /* ---------- selection + inspector ---------- */
    function ids(kind, b) {
      if (kind === "Section") { const o = [b.i]; for (let j = b.i + 1; j < blocks.length && !(blocks[j].type === "h" && blocks[j].lvl <= b.lvl); j++)o.push(j); return o }
      return blocks.filter(x => x.group === b.group && x.type !== "h").map(x => x.i).concat(b.type === "h" ? [b.i] : []).sort((a, c) => a - c);
    }
    function choose(kind, idList, text, opts = {}) {
      const bl = idList.map(i => blocks[i]).filter(Boolean), pg = bl.find(b => b.page)?.page || 0;
      const queries = text ? [[text, pg]] : kind === "Section" ? bl.map(b => [b.text, b.page]) : [[bl.map(b => b.text).join(" "), pg]];
      const matches = pdfOK ? queries.map(([t, p]) => findInPdf(t, p)).filter(Boolean) : [];
      sel = { kind, ids: idList, bl, matches, raw: text || bl.map(b => b.text).join("\n"), total: queries.length, section: bl[0]?.section || "" };
      $$(".md .sel").forEach(e => e.classList.remove("sel"));
      idList.forEach(i => $(`.md [data-b="${i}"]`)?.classList.add("sel"));
      if (opts.scrollMd && idList.length) $(`.md [data-b="${idList[0]}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
      drawHl(true); inspect();
    }
    function inspect() {
      const el = $("#insp"); if (!sel) { el.classList.add("hidden"); return }
      const heads = sel.bl.filter(b => b.type === "li"), h = heads[0], single = sel.kind === "Item" && heads.length === 1;
      let chips = "";
      if (single && h.pp.length) chips += h.pp.map((p, k) => `<span class="chip price">${esc((h.cols[k] ? h.cols[k] + " " : "") + p)}</span>`).join("");
      else { const pr = [...new Set(sel.raw.match(PRICE_RE) || [])]; chips += sel.kind === "Section" ? `<span class="chip">${heads.length} items</span>` : pr.length ? pr.slice(0, 6).map(p => `<span class="chip price">${esc(p)}</span>`).join("") : '<span class="chip">No price in selection</span>' }
      const tags = [...new Set(heads.flatMap(b => b.tags))];
      chips += tags.map(t => `<span class="chip tag">${esc(t)}</span>`).join("") + (heads.some(b => b.chef) ? '<span class="chip tag">♛ Recommended</span>' : "");
      const m = sel.matches, ok = m.length, ex = m.every(x => x.exact), sc = Math.round(Math.min(...m.map(x => x.score)) * 100);
      el.innerHTML = `<span class="chip hit">${esc(sel.kind)}</span>${sel.section && sel.kind !== "Section" ? `<span class="chip">Section: ${esc(sel.section)}</span>` : ""}${chips}` +
        `<span class="chip ${ok ? "hit" : "bad"}">${!pdfOK ? "PDF highlighting unavailable" : ok ? `PDF: ${m.length}/${sel.total} matched · p.${[...new Set(m.map(x => x.page + 1))].join(",")} · ${ex ? "exact" : sc + "%"}` : "Not found in PDF text (scanned or reworded?)"}</span><span class="spacer"></span><button class="btn sm" id="cp">Copy</button><button class="btn sm" id="clr">Clear</button><div class="t">${esc(sel.raw.replace(/\n/g, " ").slice(0, 220))}</div>`;
      el.classList.remove("hidden");
      $("#cp").onclick = () => navigator.clipboard?.writeText(sel.raw).then(() => toast("Copied"));
      $("#clr").onclick = () => { sel = null; $$(".md .sel").forEach(e => e.classList.remove("sel")); drawHl(false); inspect() };
    }
    $("#mdBody").addEventListener("mouseup", e => {
      const s = getSelection(), t = s && !s.isCollapsed ? s.toString().trim() : "";
      if (t.length > 2) { const r = s.getRangeAt(0), near = [...$$(".md [data-b]")].filter(x => r.intersectsNode(x)).map(x => +x.dataset.b); choose("Text", near, t); return }
      const el = e.target.closest("[data-b]"); if (!el) return; const b = blocks[+el.dataset.b]; choose(b.type === "h" ? "Section" : "Item", ids(b.type === "h" ? "Section" : "Item", b), null);
    });
    $("#pdfBody").addEventListener("mouseup", e => { // PDF -> markdown
      if (!e.target.closest(".tl")) return; const s = getSelection().toString().trim(), q = s || (e.target.tagName === "SPAN" ? e.target.textContent.trim() : ""); if (!q) return;
      const qt = tok(q.replace(STRIP, " ")).map(t => t.w); if (!qt.length) return; let best = null, bs = 0;
      blocks.forEach(b => { if (!b.tokens.length) return; const set = new Set(b.tokens), sc = qt.filter(w => set.has(w)).length / qt.length - Math.abs(set.size - qt.length) * .01; if (sc > bs) { bs = sc; best = b } });
      if (best && bs >= .6) { $("#mdR")?.classList.remove("hidden"); $("#mdS")?.classList.add("hidden"); UI.mdCol && (UI.mdCol = false, applyUI()); const k = best.type === "h" ? "Section" : "Item"; choose(k, ids(k, best), null, { scrollMd: true }) }
      else toast("No matching markdown found for that PDF text.");
    });

    /* ---------- keys + boot ---------- */
    document.addEventListener("keydown", e => {
      const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
      if (e.key === "/" && !typing) { e.preventDefault(); $("#search").focus() }
      else if (e.key === "Escape") { document.activeElement.blur(); if (sel) { sel = null; $$(".md .sel").forEach(x => x.classList.remove("sel")); drawHl(false); inspect() } }
      else if (!typing && e.key === "[") $("#bSide").click();
      else if (!typing && e.key === "m") $("#bMin").click();
    });
    async function boot() {
      applyUI();
      try {
        try {
          const [pmRes, srRes, mrRes] = await Promise.all([
            fetch("pdf_map.json", { cache: "no-store" }).catch(() => null),
            fetch("seed_reviews.json", { cache: "no-store" }).catch(() => null),
            fetch("/api/menu-reviews", { cache: "no-store" }).catch(() => null)
          ]);
          if (pmRes && pmRes.ok) PDF_MAP = await pmRes.json().catch(() => ({}));
          if (srRes && srRes.ok) SEED_REVIEWS = await srRes.json().catch(() => ([]));
          if (mrRes && mrRes.ok) {
            const mrData = await mrRes.json().catch(() => ({}));
            if (mrData && mrData.reviews) reviews = mrData.reviews;
          }
        } catch (e) { }

        let r = await fetch("/api/menus", { cache: "no-store" }).catch(() => null);
        if (!r || !r.ok) {
          r = await fetch("menus.json", { cache: "no-store" }).catch(() => null);
        }
        if (!r || !r.ok) throw new Error("Could not load menu list (" + (r ? r.status : "network error") + ")");
        menus = (await r.json()).map(m => { const v = venueOf(m.name); return { ...m, venue: v, region: REG[v] || UNK } });
        $("#totalCount").textContent = menus.length; counts(); fillSelects(); renderList();
        if (menus.length) await openMenu(menus[0].name); else $("#mdBody").innerHTML = '<div class="empty">No markdown menus were found in menus_md/.</div>';
      } catch (e) { $("#mdBody").innerHTML = `<div class="empty">Could not connect to the menu server. Start it with <code>python3 menu_review_server.py</code> from the project root.<br><br>${esc(e.message)}</div>`; $("#visibleCount").textContent = "Server unavailable" }
    }
    boot();
  </script>
